<!DOCTYPE html>
<html>

<head>
    <title>Drawing Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="Canvas-container">
            <canvas id="canvas" width="28" height="28" willReadFrequently="True"></canvas>
        </div>
        <div class="statements">
            <div class="controls">
                <label for="stroke-width">Stroke Width: </label>
                <input type="range" id="stroke-width" min="1" max="4" value="1">
                <span id="stroke-value">1</span> px
            </div>
            <div class="controls">
                <label for="sigma">Sigma: </label>
                <input disabled type="range" id="sigma" step="0.1" min="0" max="2" value="1">
                <span id="sigmaValue">1</span>
            </div>
            <div class="butttons">
                <input type="button" value="gaussian" id="gaussian">
                <input type="button" value="clear" id="clear">
            </div>
            <div class="number_statement0">
                <span>number 0: </span>
                <span id="num0">0</span>
                <span>%</span>
            </div>
            <div class="number_statement1">
                <span>number 1: </span>
                <span id="num1">0</span>
                <span>%</span>
            </div>
            <div class="number_statement2">
                <span>number 2: </span>
                <span id="num2">0</span>
                <span>%</span>
            </div>
            <div class="number_statement3">
                <span>number 3: </span>
                <span id="num3">0</span>
                <span>%</span>
            </div>
            <div class="number_statement4">
                <span>number 4: </span>
                <span id="num4">0</span>
                <span>%</span>
            </div>
            <div class="number_statement5">
                <span>number 5: </span>
                <span id="num5">0</span>
                <span>%</span>
            </div>
            <div class="number_statement6">
                <span>number 6: </span>
                <span id="num6">0</span>
                <span>%</span>
            </div>
            <div class="number_statement7">
                <span>number 7: </span>
                <span id="num7">0</span>
                <span>%</span>
            </div>
            <div class="number_statement8">
                <span>number 8: </span>
                <span id="num8">0</span>
                <span>%</span>
            </div>
            <div class="number_statement9">
                <span>number 9: </span>
                <span id="num9">0</span>
                <span>%</span>
            </div>
        
        </div>
    </div>

</body>
<script src="app.js"></script>

</html>
