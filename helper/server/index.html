<!DOCTYPE html>
<html>

<head>
    <title>Drawing Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="Canvas-container">
            <canvas id="canvas" width="28" height="28" willReadFrequently="True"></canvas>
        </div>
        <div class="statements">
            <div class="controls">
                <label for="stroke-width">Stroke Width: </label>
                <input type="range" id="stroke-width" min="1" max="10" value="1">
                <span id="stroke-value">1</span> px
            </div>
            <p>number 1</p>
            <p>number 2</p>
        </div>
    </div>

</body>
<script src="app.js"></script>

</html>
